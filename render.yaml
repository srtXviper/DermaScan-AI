services:
  - type: web
    name: dermascan-ai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HF_REPO_ID
        value: SRTxVIPER/dermascan-skin-cnn
      - key: MODEL_FILENAME
        value: skin_cnn.pth
